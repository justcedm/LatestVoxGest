plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.voxgest.dryrun"
    compileSdk 34

    defaultConfig {
        applicationId "com.voxgest.dryrun"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    androidResources {
        noCompress "tflite"
        noCompress "task"
        noCompress "glb"
    }

    sourceSets {
        main {
            assets.srcDirs = [
                    "src/main/assets"
            ]
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class:1.2.1"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    implementation "androidx.navigation:navigation-fragment:2.8.5"
    implementation "androidx.navigation:navigation-ui:2.8.5"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.android.filament:filament-android:1.71.4"
    implementation "com.google.android.filament:filament-utils-android:1.71.4"
    implementation "com.google.android.filament:gltfio-android:1.71.4"
    implementation "com.google.mediapipe:tasks-vision:0.10.14"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.tensorflow:tensorflow-lite:2.17.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
