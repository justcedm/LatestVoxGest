plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.voxgest.dryrun"
    compileSdk 35

    defaultConfig {
        applicationId "com.voxgest.dryrun"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    androidResources {
        noCompress "tflite"
    }

    sourceSets {
        main {
            assets.srcDirs = [
                    "src/main/assets",
                    "../../avatar",
                    "../../model"
            ]
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    implementation "androidx.navigation:navigation-fragment:2.8.5"
    implementation "androidx.navigation:navigation-ui:2.8.5"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
    implementation "com.google.android.material:material:1.12.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
    // Keep Java sources compiling, but do not package libtensorflowlite_jni.so in
    // the UI preview build because the upstream JNI binary is not 16 KB aligned.
    compileOnly "org.tensorflow:tensorflow-lite:2.17.0"
}
